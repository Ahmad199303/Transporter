<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المساعد الذكي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap');

    :root {
      --bg-deep:      #080c14;
      --bg-surface:   #0e1420;
      --bg-card:      #131927;
      --bg-input:     #1a2235;
      --border:       rgba(99,179,255,0.10);
      --border-glow:  rgba(99,179,255,0.28);
      --accent:       #3b82f6;
      --accent-soft:  rgba(59,130,246,0.12);
      --accent-glow:  rgba(59,130,246,0.30);
      --purple:       #8b5cf6;
      --teal:         #06b6d4;
      --text-primary: #e8edf5;
      --text-muted:   #6b7ea0;
      --user-bubble:  linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      --bot-bubble:   #131927;
      --radius-lg:    20px;
      --radius-md:    14px;
      --sidebar-w:    280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans Arabic', 'Tahoma', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ───── SIDEBAR ───── */
    .sidebar {
      position: relative;
      z-index: 10;
      width: var(--sidebar-w);
      height: 100dvh;
      background: rgba(10,14,24,0.95);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .sidebar.hidden {
      transform: translateX(100%);
      position: fixed;
      left: auto;
      right: 0;
    }

    .sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--accent-soft);
      border: 1px solid var(--border-glow);
      border-radius: 10px;
      color: var(--accent);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: rgba(59,130,246,0.2); }

    .sessions-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px;
    }

    .sessions-list::-webkit-scrollbar { width: 3px; }
    .sessions-list::-webkit-scrollbar-thumb { background: rgba(99,179,255,0.1); border-radius: 3px; }

    .session-item {
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .session-item:hover { background: rgba(59,130,246,0.08); }
    .session-item.active { background: var(--accent-soft); border: 1px solid var(--border-glow); }

    .session-icon {
      font-size: 14px;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .session-info { flex: 1; min-width: 0; }

    .session-preview {
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-item.active .session-preview { color: var(--accent); }

    .session-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .session-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .session-item:hover .session-delete { opacity: 1; }
    .session-delete:hover { color: #f87171; }

    .no-sessions {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }

    .clear-all-btn {
      width: 100%;
      padding: 8px;
      background: none;
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 10px;
      color: #f87171;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .clear-all-btn:hover { background: rgba(248,113,113,0.08); }

    /* ───── MAIN ───── */
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ───── HEADER ───── */
    .header {
      padding: 14px 18px;
      background: rgba(13,19,32,0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-soft);
      border: 1px solid var(--border-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .logo-ring::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--purple), var(--teal), var(--accent));
      z-index: -1;
      opacity: 0.5;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-ring svg { width: 16px; height: 16px; }

    .header-text { flex: 1; min-width: 0; }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-status {
      font-size: 11px;
      color: var(--teal);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }
    .dot-online {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .history-toggle {
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .history-toggle:hover { border-color: var(--border-glow); color: var(--text-primary); }
    .history-toggle.active { border-color: var(--border-glow); color: var(--accent); }

    /* ───── CHAT ───── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 130px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 4px; }
    .chat::-webkit-scrollbar-thumb { background: rgba(99,179,255,0.15); border-radius: 4px; }

    .message {
      display: flex;
      margin-bottom: 18px;
      animation: fadeUp 0.22s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .message.user { justify-content: flex-start; }
    .message.bot  { justify-content: flex-end; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-top: 2px;
    }
    .message.user .avatar {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      margin-left: 9px;
      order: 2;
    }
    .message.bot .avatar {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      margin-right: 9px;
    }

    .bubble {
      max-width: 74%;
      padding: 12px 15px;
      border-radius: var(--radius-lg);
      line-height: 1.75;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
    }
    .user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 18px rgba(59,130,246,0.22);
    }
    .bot .bubble {
      background: var(--bot-bubble);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-right-radius: 4px;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s ease-in-out infinite;
      margin: 0 1px;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform:translateY(0); opacity:0.4; }
      40%          { transform:translateY(-6px); opacity:1; }
    }

    /* ───── WELCOME ───── */
    .welcome {
      text-align: center;
      padding: 40px 20px 20px;
    }
    .welcome-icon {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--accent-soft);
      border: 1px solid var(--border-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 26px;
    }
    .welcome h2 { font-size: 19px; font-weight: 600; margin-bottom: 8px; }
    .welcome p { font-size: 13.5px; color: var(--text-muted); line-height: 1.7; }

    /* ───── INPUT ───── */
    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 16px 18px;
      background: linear-gradient(to top, var(--bg-deep) 70%, transparent);
      display: flex;
      justify-content: center;
    }

    .input-inner {
      width: 100%;
      max-width: 860px;
    }

    /* offset when sidebar open — handled via JS class on body */
    body.sidebar-open .input-area {
      right: var(--sidebar-w);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 9px 11px;
      transition: border-color 0.2s;
    }
    .input-box:focus-within {
      border-color: var(--border-glow);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.6;
    }
    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 40px; height: 40px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .send-btn:hover:not(:disabled) { transform: scale(1.08); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 7px;
      opacity: 0.6;
    }

    /* mobile overlay */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9;
    }
    @media (max-width: 640px) {
      .sidebar { position: fixed; right: 0; top: 0; height: 100dvh; }
      .sidebar.hidden { transform: translateX(100%); }
      .sidebar-overlay.show { display: block; }
      body.sidebar-open .input-area { right: 0; }
    }
  </style>
</head>
<body>
<div class="sidebar-overlay id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar hidden" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">السجل</span>
    <button class="new-chat-btn" onclick="newSession()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      جديد
    </button>
  </div>
  <div class="sessions-list" id="sessionsList"></div>
  <div class="sidebar-footer">
    <button class="clear-all-btn" onclick="clearAllSessions()">🗑 مسح كل السجل</button>
  </div>
</div>

<div class="main">
  <div class="header">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="#63b3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">المساعد الذكي</div>
      <div class="header-status">
        <span class="dot-online"></span>
        متصل وجاهز
      </div>
    </div>
    <button class="history-toggle" id="historyToggle" onclick="toggleSidebar()" title="السجل">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>
      </svg>
      السجل
    </button>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input-area">
    <div class="input-inner">
      <div class="input-box">
        <textarea id="messageInput" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="إرسال">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter للإرسال • Shift+Enter لسطر جديد</div>
    </div>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://n8n.srv1764172.hstgr.cloud/webhook/ai-agent";
  const STORAGE_KEY = "ai_chat_sessions";

  const chatEl    = document.getElementById("chat");
  const input     = document.getElementById("messageInput");
  const sendBtn   = document.getElementById("sendBtn");
  const sidebar   = document.getElementById("sidebar");
  const overlay   = document.getElementById("overlay");
  const histBtn   = document.getElementById("historyToggle");
  const sessList  = document.getElementById("sessionsList");

  let sessions = [];       // [{ id, title, date, messages: [{role,text}] }]
  let activeId = null;
  let sidebarOpen = false;

  // ── Storage ──
  function loadSessions() {
    try { sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { sessions = []; }
  }
  function saveSessions() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  }

  // ── Session helpers ──
  function getSession(id) { return sessions.find(s => s.id === id); }

  function newSession() {
    const id = Date.now().toString();
    sessions.unshift({ id, title: "محادثة جديدة", date: new Date().toISOString(), messages: [] });
    saveSessions();
    loadSession(id);
    renderSessionsList();
  }

  function loadSession(id) {
    activeId = id;
    const s = getSession(id);
    chatEl.innerHTML = "";
    if (!s || s.messages.length === 0) {
      renderWelcome();
    } else {
      s.messages.forEach(m => renderMessage(m.text, m.role, false));
    }
    renderSessionsList();
  }

  function saveMessage(role, text) {
    const s = getSession(activeId);
    if (!s) return;
    s.messages.push({ role, text });
    // update title from first user message
    if (s.title === "محادثة جديدة") {
      const first = s.messages.find(m => m.role === "user");
      if (first) s.title = first.text.slice(0, 40);
    }
    s.date = new Date().toISOString();
    // keep sessions sorted by latest
    sessions = [s, ...sessions.filter(x => x.id !== activeId)];
    saveSessions();
    renderSessionsList();
  }

  function deleteSession(id, e) {
    e.stopPropagation();
    sessions = sessions.filter(s => s.id !== id);
    saveSessions();
    if (activeId === id) {
      if (sessions.length > 0) loadSession(sessions[0].id);
      else newSession();
    } else {
      renderSessionsList();
    }
  }

  function clearAllSessions() {
    if (!confirm("مسح كل المحادثات؟")) return;
    sessions = [];
    saveSessions();
    newSession();
  }

  // ── Sidebar ──
  function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    sidebar.classList.toggle("hidden", !sidebarOpen);
    overlay.classList.toggle("show", sidebarOpen);
    document.body.classList.toggle("sidebar-open", sidebarOpen);
    histBtn.classList.toggle("active", sidebarOpen);
  }

  // ── Render sessions list ──
  function formatDate(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return "الآن";
    if (diff < 3600000) return Math.floor(diff/60000) + " د";
    if (diff < 86400000) return Math.floor(diff/3600000) + " س";
    return d.toLocaleDateString("ar-JO", { month:"short", day:"numeric" });
  }

  function renderSessionsList() {
    sessList.innerHTML = "";
    if (sessions.length === 0) {
      sessList.innerHTML = '<div class="no-sessions">لا توجد محادثات<br/>ابدأ محادثة جديدة ✦</div>';
      return;
    }
    sessions.forEach(s => {
      const item = document.createElement("div");
      item.className = "session-item" + (s.id === activeId ? " active" : "");
      item.innerHTML = `
        <div class="session-icon">💬</div>
        <div class="session-info">
          <div class="session-preview">${escHtml(s.title)}</div>
          <div class="session-date">${formatDate(s.date)}</div>
        </div>
        <button class="session-delete" title="حذف">✕</button>
      `;
      item.addEventListener("click", () => loadSession(s.id));
      item.querySelector(".session-delete").addEventListener("click", (e) => deleteSession(s.id, e));
      sessList.appendChild(item);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── Render UI ──
  function renderWelcome() {
    const w = document.createElement("div");
    w.className = "welcome";
    w.innerHTML = `
      <div class="welcome-icon">✦</div>
      <h2>مرحباً بك</h2>
      <p>اسألني أي شيء وسأحاول مساعدتك<br/>عبر وكيل الذكاء الاصطناعي</p>
    `;
    chatEl.appendChild(w);
  }

  function renderMessage(text, role, animate = true) {
    // remove welcome card if present
    const wc = chatEl.querySelector(".welcome");
    if (wc) wc.remove();

    const wrap = document.createElement("div");
    wrap.className = "message " + role;
    if (!animate) wrap.style.animation = "none";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "أ" : "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function renderTyping() {
    const wc = chatEl.querySelector(".welcome");
    if (wc) wc.remove();

    const wrap = document.createElement("div");
    wrap.className = "message bot";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `<div class="typing-indicator"><div class="dots"><span></span><span></span><span></span></div>جاري التفكير...</div>`;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  // ── Send ──
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !activeId) return;

    renderMessage(text, "user");
    saveMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    const typingBubble = renderTyping();

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      const reply = data.reply || data.output || data.text || JSON.stringify(data, null, 2);

      typingBubble.innerHTML = "";
      typingBubble.textContent = reply;
      saveMessage("bot", reply);

    } catch (err) {
      typingBubble.innerHTML = "";
      typingBubble.textContent = "تعذّر الاتصال بالوكيل. تأكد أن n8n يعمل وأن رابط الـ webhook صحيح.";
      console.error(err);
    }

    sendBtn.disabled = false;
    input.focus();
  }

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Init ──
  loadSessions();
  if (sessions.length === 0) {
    newSession();
  } else {
    loadSession(sessions[0].id);
  }
  renderSessionsList();
</script>
</body>
</html>
