<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المساعد الذكي</title>
  <style>
    :root {
      --bg: #fff0ca;
      --panel: #f7df9f;
      --text: #1d1714;
      --muted: #6b5440;
      --line: rgba(101, 74, 43, .24);
      --accent: #d9b30d;
      --accent-dark: #9c4a14;
      --danger: #b83232;
      --shadow: 0 18px 50px rgba(87, 55, 16, .22);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, transparent 0 calc(50% - 44px), rgba(221, 181, 8, .75) calc(50% - 44px) calc(50% - 34px), transparent calc(50% - 34px)),
        linear-gradient(90deg, transparent 0 calc(50% - 22px), rgba(194, 61, 18, .75) calc(50% - 22px) calc(50% - 13px), transparent calc(50% - 13px)),
        linear-gradient(90deg, transparent 0 calc(50% + 2px), rgba(83, 52, 28, .78) calc(50% + 2px) calc(50% + 11px), transparent calc(50% + 11px)),
        linear-gradient(90deg, transparent 0 calc(50% + 25px), rgba(39, 127, 118, .72) calc(50% + 25px) calc(50% + 35px), transparent calc(50% + 35px)),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      background: rgba(39, 28, 19, .92);
      color: #fff7dd;
      border-left: 1px solid rgba(255, 255, 255, .12);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: -12px 0 40px rgba(44, 25, 8, .2);
    }

    html[dir="ltr"] .sidebar {
      border-left: 0;
      border-right: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 12px 0 40px rgba(44, 25, 8, .2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px;
      font-weight: 800;
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid rgba(217, 179, 13, .75);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .24);
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: #f1d982;
      font-weight: 600;
    }

    .side-button {
      width: 100%;
      border: 1px solid rgba(255, 240, 202, .22);
      color: #fff7dd;
      background: rgba(255, 255, 255, .06);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      text-align: start;
    }

    .side-button:hover {
      background: rgba(217, 179, 13, .2);
    }

    .config {
      margin-top: auto;
      border-top: 1px solid rgba(255, 240, 202, .2);
      padding-top: 14px;
      display: grid;
      gap: 10px;
    }

    .config label {
      color: #f1d982;
      font-size: 13px;
    }

    .config input {
      width: 100%;
      border: 1px solid rgba(255, 240, 202, .22);
      background: rgba(0, 0, 0, .22);
      color: #fff7dd;
      border-radius: 8px;
      padding: 10px;
      direction: ltr;
      text-align: left;
    }

    .main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      min-height: 100vh;
      background: rgba(255, 240, 202, .78);
      backdrop-filter: blur(1px);
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 240, 202, .84);
      backdrop-filter: blur(12px);
    }

    .agent-title,
    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agent-title {
      font-weight: 800;
    }

    .agent-title img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .language-switch {
      border: 1px solid rgba(156, 74, 20, .28);
      background: rgba(255, 255, 255, .62);
      color: #2b1d0a;
      border-radius: 999px;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 108px;
      position: relative;
    }

    .language-switch span {
      flex: 1;
      border-radius: 999px;
      padding: 5px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 750;
      color: rgba(43, 29, 10, .65);
      transition: .2s ease;
    }

    .language-switch[data-lang="ar"] .ar,
    .language-switch[data-lang="en"] .en {
      background: linear-gradient(135deg, var(--accent), #f2d45d);
      color: #2b1d0a;
      box-shadow: 0 6px 14px rgba(156, 74, 20, .18);
    }

    .history {
      border-top: 1px solid rgba(255, 240, 202, .18);
      padding-top: 14px;
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    .history-title {
      color: #f1d982;
      font-size: 13px;
      font-weight: 750;
    }

    .history-list {
      display: grid;
      gap: 6px;
      max-height: 320px;
      overflow: auto;
    }

    .history-item {
      border: 1px solid rgba(255, 240, 202, .14);
      background: rgba(255, 255, 255, .05);
      color: #fff7dd;
      border-radius: 8px;
      padding: 10px;
      text-align: start;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item:hover,
    .history-item.active {
      background: rgba(217, 179, 13, .2);
    }

    .empty-history {
      color: rgba(255, 247, 221, .62);
      font-size: 13px;
      line-height: 1.6;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .messages {
      overflow-y: auto;
      padding: 30px 18px 150px;
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: calc(100vh - 260px);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--text);
    }

    .welcome-card {
      max-width: 610px;
      padding: 24px;
    }

    .hero-logo {
      width: 150px;
      height: 150px;
      border-radius: 28px;
      object-fit: cover;
      border: 4px solid rgba(217, 179, 13, .75);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: 0;
      color: #c39b05;
      text-shadow: 0 2px 0 rgba(255, 255, 255, .75);
    }

    .welcome p {
      color: var(--muted);
      margin: 12px auto 0;
      max-width: 520px;
      line-height: 1.8;
      font-weight: 650;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 22px;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 14px;
      direction: inherit;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message.user .avatar {
      background: #59402d;
      color: #fff7dd;
    }

    .message.assistant .avatar {
      background: var(--accent);
      color: #2b1d0a;
    }

    .bubble {
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding-top: 5px;
    }

    .message.user .bubble {
      background: rgba(255, 255, 255, .66);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 16px;
      width: fit-content;
      max-width: 100%;
      justify-self: start;
      box-shadow: 0 8px 22px rgba(87, 55, 16, .08);
    }

    .composer-wrap {
      position: fixed;
      right: 300px;
      left: 0;
      bottom: 0;
      padding: 18px;
      background: linear-gradient(to top, rgba(255, 240, 202, 1) 72%, rgba(255, 240, 202, 0));
    }

    html[dir="ltr"] .composer-wrap {
      right: 0;
      left: 300px;
    }

    .composer {
      max-width: 850px;
      margin: 0 auto;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(156, 74, 20, .24);
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px;
    }

    .composer textarea {
      min-height: 52px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      padding: 12px 10px;
      line-height: 1.7;
      direction: inherit;
    }

    .composer textarea::placeholder {
      color: rgba(107, 84, 64, .8);
    }

    .send {
      align-self: end;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff7dd;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      box-shadow: 0 8px 20px rgba(156, 74, 20, .24);
    }

    .send:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .hint {
      max-width: 850px;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding-top: 8px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent-dark);
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    .error {
      color: var(--danger);
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: .3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-4px); }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .composer-wrap,
      html[dir="ltr"] .composer-wrap {
        right: 0;
        left: 0;
      }

      .topbar {
        padding-inline: 12px;
      }

      .messages {
        padding-inline: 12px;
      }

      .message {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assistant-logo.jpeg" alt="" />
        <div>
          <div data-i18n="assistantName">المساعد الذكي</div>
          <small data-i18n="connected">مرتبط مع n8n</small>
        </div>
      </div>

      <button class="side-button" id="newChatBtn" data-i18n="newChat">+ محادثة جديدة</button>

      <div class="history">
        <div class="history-title" data-i18n="historyTitle">سجل المحادثات</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="agent-title">
          <img src="assistant-logo.jpeg" alt="" />
          <span data-i18n="assistantName">المساعد الذكي</span>
        </div>
        <div class="top-actions">
          <button class="language-switch" id="languageSwitch" type="button" data-lang="ar" aria-label="Language">
            <span class="ar">عربي</span>
            <span class="en">EN</span>
          </button>
          <div class="status" id="statusText">جاهز</div>
        </div>
      </header>

      <section class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-card">
            <img class="hero-logo" src="assistant-logo.jpeg" alt="" />
            <h1 data-i18n="assistantName">المساعد الذكي</h1>
            <p data-i18n="welcomeText">اسألني أي شيء</p>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" data-placeholder-key="promptPlaceholder" placeholder="اكتب رسالتك هنا..." autocomplete="off"></textarea>
          <button class="send" id="sendBtn" type="submit" data-aria-key="sendLabel" aria-label="إرسال">↑</button>
        </form>
        <div class="hint" data-i18n="hint">Enter للإرسال، و Shift + Enter لسطر جديد</div>
      </div>
    </main>
  </div>

  <script>
    const DEFAULT_WEBHOOK_URL = "https://n8n.srv1764172.hstgr.cloud/webhook/ai-agent";
    const LANGUAGE_STORAGE_KEY = "assistant_ui_language";
    const CHAT_HISTORY_KEY = "assistant_chat_history";
    const ACTIVE_CHAT_KEY = "assistant_active_chat_id";

    const translations = {
      ar: {
        assistantName: "المساعد الذكي",
        connected: "مرتبط مع n8n",
        newChat: "+ محادثة جديدة",
        historyTitle: "سجل المحادثات",
        emptyHistory: "لا توجد محادثات محفوظة بعد.",
        welcomeText: "اسألني أي شيء",
        promptPlaceholder: "اكتب رسالتك هنا...",
        sendLabel: "إرسال",
        hint: "Enter للإرسال، و Shift + Enter لسطر جديد",
        ready: "جاهز",
        thinking: "يفكر...",
        sendFailed: "تعذر الإرسال",
        newChatStatus: "محادثة جديدة",
        pinnedStatus: "تم تثبيت الرابط",
        emptyReply: "وصل رد فارغ من n8n.",
        connectionFailed: "فشل الاتصال مع n8n. الكود:",
        unexpectedError: "حدث خطأ غير متوقع.",
        you: "أنت"
      },
      en: {
        assistantName: "Smart Assistant",
        connected: "Connected with n8n",
        newChat: "+ New chat",
        historyTitle: "Chat history",
        emptyHistory: "No saved chats yet.",
        welcomeText: "Ask me anything",
        promptPlaceholder: "Type your message here...",
        sendLabel: "Send",
        hint: "Press Enter to send, Shift + Enter for a new line",
        ready: "Ready",
        thinking: "Thinking...",
        sendFailed: "Could not send",
        newChatStatus: "New chat",
        pinnedStatus: "Webhook pinned",
        emptyReply: "n8n returned an empty reply.",
        connectionFailed: "Could not connect to n8n. Status:",
        unexpectedError: "Something went wrong.",
        you: "You"
      }
    };

    const messagesEl = document.getElementById("messages");
    let welcomeEl = document.getElementById("welcome");
    const formEl = document.getElementById("chatForm");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("statusText");
    const newChatBtn = document.getElementById("newChatBtn");
    const languageSwitch = document.getElementById("languageSwitch");
    const historyList = document.getElementById("historyList");

    let conversation = [];
    let chatHistory = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || "[]");
    let activeChatId = localStorage.getItem(ACTIVE_CHAT_KEY) || createChatId();
    let currentLanguage = localStorage.getItem(LANGUAGE_STORAGE_KEY) || "ar";

    function t(key) {
      return translations[currentLanguage][key] || translations.ar[key] || key;
    }

    function setStatus(keyOrText, isKey = true) {
      statusText.textContent = isKey ? t(keyOrText) : keyOrText;
    }

    function applyLanguage(language) {
      currentLanguage = language;
      localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      document.title = t("assistantName");
      languageSwitch.dataset.lang = language;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });

      document.querySelectorAll("[data-placeholder-key]").forEach((el) => {
        el.placeholder = t(el.dataset.placeholderKey);
      });

      document.querySelectorAll("[data-aria-key]").forEach((el) => {
        el.setAttribute("aria-label", t(el.dataset.ariaKey));
      });

      setStatus("ready");
      renderHistory();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function createWelcome() {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.id = "welcome";
      welcome.innerHTML = `
        <div class="welcome-card">
          <img class="hero-logo" src="assistant-logo.jpeg" alt="" />
          <h1 data-i18n="assistantName">${t("assistantName")}</h1>
          <p data-i18n="welcomeText">${t("welcomeText")}</p>
        </div>
      `;
      return welcome;
    }

    function createChatId() {
      return `chat-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function getChatTitle(messages) {
      const firstUserMessage = messages.find((item) => item.role === "user")?.content || t("newChat").replace("+ ", "");
      return firstUserMessage.slice(0, 46);
    }

    function saveChat() {
      if (!conversation.length) return;

      const existingIndex = chatHistory.findIndex((chat) => chat.id === activeChatId);
      const chat = {
        id: activeChatId,
        title: getChatTitle(conversation),
        messages: conversation,
        updatedAt: new Date().toISOString()
      };

      if (existingIndex >= 0) {
        chatHistory[existingIndex] = chat;
      } else {
        chatHistory.unshift(chat);
      }

      chatHistory.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      chatHistory = chatHistory.slice(0, 30);
      localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory));
      localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = "";

      if (!chatHistory.length) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.textContent = t("emptyHistory");
        historyList.append(empty);
        return;
      }

      chatHistory.forEach((chat) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = chat.id === activeChatId ? "history-item active" : "history-item";
        item.textContent = chat.title || t("newChat").replace("+ ", "");
        item.addEventListener("click", () => loadChat(chat.id));
        historyList.append(item);
      });
    }

    function renderConversation() {
      messagesEl.innerHTML = "";

      if (!conversation.length) {
        welcomeEl = createWelcome();
        messagesEl.append(welcomeEl);
        return;
      }

      welcomeEl = null;
      conversation.forEach((message) => {
        addMessage(message.role, message.content);
      });
    }

    function loadChat(chatId) {
      const chat = chatHistory.find((item) => item.id === chatId);
      if (!chat) return;

      activeChatId = chat.id;
      conversation = [...chat.messages];
      localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
      renderConversation();
      renderHistory();
      setStatus("ready");
    }

    function startNewChat() {
      activeChatId = createChatId();
      conversation = [];
      localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
      messagesEl.innerHTML = "";
      welcomeEl = createWelcome();
      messagesEl.append(welcomeEl);
      renderHistory();
    }

    function removeWelcome() {
      if (welcomeEl && welcomeEl.parentNode) {
        welcomeEl.remove();
      }
    }

    function addMessage(role, content, options = {}) {
      removeWelcome();

      const row = document.createElement("article");
      row.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      if (role === "assistant") {
        avatar.innerHTML = '<img src="assistant-logo.jpeg" alt="" />';
      } else {
        avatar.textContent = t("you");
      }

      const bubble = document.createElement("div");
      bubble.className = options.error ? "bubble error" : "bubble";
      bubble.textContent = content;

      row.append(avatar, bubble);
      messagesEl.append(row);
      scrollToBottom();

      return { row, bubble };
    }

    function addTyping() {
      removeWelcome();

      const row = document.createElement("article");
      row.className = "message assistant";
      row.id = "typingMessage";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.innerHTML = '<img src="assistant-logo.jpeg" alt="" />';

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

      row.append(avatar, bubble);
      messagesEl.append(row);
      scrollToBottom();
      return row;
    }

    function autoResize() {
      promptEl.style.height = "auto";
      promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + "px";
    }

    function getAgentText(data) {
      if (typeof data === "string") {
        try {
          return getAgentText(JSON.parse(data));
        } catch {
          return data;
        }
      }
      if (!data || typeof data !== "object") return t("emptyReply");

      return data.output ||
        data.reply ||
        data.replay ||
        data.response ||
        data.answer ||
        data.text ||
        data.message ||
        data.result ||
        data.data?.output ||
        data.data?.reply ||
        data.data?.replay ||
        data.data?.response ||
        JSON.stringify(data, null, 2);
    }

    async function sendToAgent(message) {
      const payload = {
        message,
        chatInput: message,
        assistantName: t("assistantName"),
        interfaceLanguage: currentLanguage,
        conversation,
        timestamp: new Date().toISOString()
      };

      const response = await fetch(DEFAULT_WEBHOOK_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`${t("connectionFailed")} ${response.status}`);
      }

      const contentType = response.headers.get("content-type") || "";
      const data = contentType.includes("application/json")
        ? await response.json()
        : await response.text();

      return getAgentText(data);
    }

    async function handleSubmit(event) {
      event.preventDefault();

      const message = promptEl.value.trim();
      if (!message) return;

      promptEl.value = "";
      autoResize();
      sendBtn.disabled = true;
      setStatus("thinking");

      addMessage("user", message);
      conversation.push({ role: "user", content: message });
      saveChat();

      const typingEl = addTyping();

      try {
        const reply = await sendToAgent(message);
        typingEl.remove();
        addMessage("assistant", reply);
        conversation.push({ role: "assistant", content: reply });
        saveChat();
        setStatus("ready");
      } catch (error) {
        typingEl.remove();
        addMessage("assistant", error.message || t("unexpectedError"), { error: true });
        setStatus("sendFailed");
      } finally {
        sendBtn.disabled = false;
        promptEl.focus();
      }
    }

    newChatBtn.addEventListener("click", () => {
      startNewChat();
      setStatus("newChatStatus");
      setTimeout(() => setStatus("ready"), 1200);
    });

    languageSwitch.addEventListener("click", () => {
      applyLanguage(currentLanguage === "ar" ? "en" : "ar");
      renderConversation();
    });

    promptEl.addEventListener("input", autoResize);

    promptEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        formEl.requestSubmit();
      }
    });

    formEl.addEventListener("submit", handleSubmit);
    applyLanguage(currentLanguage);
    const savedActiveChat = chatHistory.find((chat) => chat.id === activeChatId);
    if (savedActiveChat) {
      conversation = [...savedActiveChat.messages];
      renderConversation();
    }
  </script>
</body>
</html>
