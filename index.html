<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المساعد الذكي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap');

    :root {
      --bg-deep:     #080c14;
      --bg-card:     #131927;
      --bg-input:    #1a2235;
      --border:      rgba(99,179,255,0.10);
      --border-glow: rgba(99,179,255,0.28);
      --accent:      #3b82f6;
      --accent-soft: rgba(59,130,246,0.12);
      --accent-glow: rgba(59,130,246,0.30);
      --purple:      #8b5cf6;
      --teal:        #06b6d4;
      --text-primary:#e8edf5;
      --text-muted:  #6b7ea0;
      --user-bubble: linear-gradient(135deg,#2563eb 0%,#3b82f6 100%);
      --bot-bubble:  #131927;
      --radius-lg:   20px;
      --sidebar-w:   280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans Arabic','Tahoma',sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    body::before {
      content:'';
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(59,130,246,0.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(59,130,246,0.03) 1px,transparent 1px);
      background-size:48px 48px;
      pointer-events:none;
      z-index:0;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      position:relative;
      z-index:10;
      width:var(--sidebar-w);
      height:100dvh;
      background:rgba(10,14,24,0.97);
      border-left:1px solid var(--border);
      display:flex;
      flex-direction:column;
      flex-shrink:0;
      transition:transform .3s ease;
    }
    .sidebar.hidden { transform:translateX(100%); position:fixed; right:0; }

    .sidebar-header {
      padding:16px 14px 12px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .sidebar-title { font-size:13px; font-weight:600; color:var(--text-muted); letter-spacing:.5px; }

    .new-chat-btn {
      display:flex; align-items:center; gap:5px;
      padding:6px 11px;
      background:var(--accent-soft);
      border:1px solid var(--border-glow);
      border-radius:10px;
      color:var(--accent);
      font-size:12px; font-family:inherit;
      cursor:pointer; transition:background .2s;
      white-space:nowrap;
    }
    .new-chat-btn:hover { background:rgba(59,130,246,.22); }

    .sessions-list { flex:1; overflow-y:auto; padding:8px; }
    .sessions-list::-webkit-scrollbar { width:3px; }
    .sessions-list::-webkit-scrollbar-thumb { background:rgba(99,179,255,.1); border-radius:3px; }

    .session-item {
      padding:10px 12px; border-radius:12px; cursor:pointer;
      margin-bottom:4px; transition:background .15s;
      display:flex; align-items:center; gap:8px;
      border:1px solid transparent;
    }
    .session-item:hover { background:rgba(59,130,246,.08); }
    .session-item.active { background:var(--accent-soft); border-color:var(--border-glow); }

    .session-icon { font-size:14px; flex-shrink:0; opacity:.7; }
    .session-info { flex:1; min-width:0; }
    .session-preview {
      font-size:13px; color:var(--text-primary);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .session-item.active .session-preview { color:var(--accent); }
    .session-date { font-size:11px; color:var(--text-muted); margin-top:2px; }

    .session-delete {
      opacity:0; background:none; border:none;
      color:var(--text-muted); cursor:pointer;
      font-size:13px; padding:3px 5px; border-radius:4px;
      transition:opacity .15s,color .15s; flex-shrink:0;
    }
    .session-item:hover .session-delete { opacity:1; }
    .session-delete:hover { color:#f87171; }

    .no-sessions { text-align:center; padding:32px 16px; color:var(--text-muted); font-size:13px; line-height:1.7; }

    .sidebar-footer { padding:12px 14px; border-top:1px solid var(--border); }
    .clear-all-btn {
      width:100%; padding:8px;
      background:none; border:1px solid rgba(248,113,113,.2);
      border-radius:10px; color:#f87171;
      font-family:inherit; font-size:12px;
      cursor:pointer; transition:background .2s;
    }
    .clear-all-btn:hover { background:rgba(248,113,113,.08); }

    /* ── MAIN ── */
    .main { position:relative; z-index:1; flex:1; height:100dvh; display:flex; flex-direction:column; min-width:0; }

    /* ── HEADER ── */
    .header {
      padding:14px 18px;
      background:rgba(13,19,32,.88);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:10px;
    }
    .logo-ring {
      width:36px; height:36px; border-radius:50%;
      background:var(--accent-soft); border:1px solid var(--border-glow);
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; position:relative;
    }
    .logo-ring::after {
      content:''; position:absolute; inset:-3px; border-radius:50%;
      background:conic-gradient(from 0deg,var(--accent),var(--purple),var(--teal),var(--accent));
      z-index:-1; opacity:.5; animation:spin 4s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .logo-ring svg { width:16px; height:16px; }

    .header-text { flex:1; min-width:0; }
    .header-title { font-size:15px; font-weight:600; }
    .header-status { font-size:11px; color:var(--teal); display:flex; align-items:center; gap:5px; margin-top:2px; }
    .dot-online {
      width:6px; height:6px; border-radius:50%;
      background:var(--teal); box-shadow:0 0 6px var(--teal);
      animation:pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }

    .header-btn {
      background:var(--accent-soft); border:1px solid var(--border);
      border-radius:10px; color:var(--text-muted);
      padding:7px 10px; cursor:pointer; font-size:12px; font-family:inherit;
      display:flex; align-items:center; gap:5px;
      transition:border-color .2s,color .2s; flex-shrink:0; white-space:nowrap;
    }
    .header-btn:hover { border-color:var(--border-glow); color:var(--text-primary); }
    .header-btn.active { border-color:var(--border-glow); color:var(--accent); }

    /* ── CHAT ── */
    .chat { flex:1; overflow-y:auto; padding:24px 16px 150px; scroll-behavior:smooth; }
    .chat::-webkit-scrollbar { width:4px; }
    .chat::-webkit-scrollbar-thumb { background:rgba(99,179,255,.15); border-radius:4px; }

    .message { display:flex; margin-bottom:18px; animation:fadeUp .22s ease-out both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .message.user { justify-content:flex-start; }
    .message.bot  { justify-content:flex-end; }

    .avatar {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; margin-top:2px;
    }
    .message.user .avatar { background:linear-gradient(135deg,#2563eb,#7c3aed); margin-left:9px; order:2; }
    .message.bot  .avatar { background:var(--bg-card); border:1px solid var(--border-glow); margin-right:9px; }

    .bubble {
      max-width:74%; padding:12px 15px; border-radius:var(--radius-lg);
      line-height:1.75; white-space:pre-wrap; word-wrap:break-word; font-size:14px;
    }
    .user .bubble { background:var(--user-bubble); color:#fff; border-bottom-left-radius:4px; box-shadow:0 4px 18px rgba(59,130,246,.22); }
    .bot  .bubble { background:var(--bot-bubble); color:var(--text-primary); border:1px solid var(--border); border-bottom-right-radius:4px; }

    /* file bubble */
    .file-bubble {
      display:flex; align-items:center; gap:10px;
      background:rgba(59,130,246,.15); border:1px solid var(--border-glow);
      border-radius:14px; padding:10px 14px; max-width:74%;
      margin-bottom:4px;
    }
    .file-bubble.user-file { margin-right:39px; }
    .file-icon { font-size:22px; flex-shrink:0; }
    .file-info { min-width:0; }
    .file-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
    .file-size { font-size:11px; color:var(--text-muted); margin-top:2px; }

    /* image preview bubble */
    .img-bubble { max-width:74%; border-radius:14px; overflow:hidden; margin-bottom:4px; }
    .img-bubble.user-img { margin-right:39px; }
    .img-bubble img { max-width:100%; max-height:260px; object-fit:cover; display:block; border-radius:14px; border:1px solid var(--border); }

    /* typing */
    .typing-indicator { display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:13px; }
    .dots span {
      display:inline-block; width:5px; height:5px; border-radius:50%;
      background:var(--accent); animation:bounce 1.2s ease-in-out infinite; margin:0 1px;
    }
    .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }

    /* ── WELCOME ── */
    .welcome { text-align:center; padding:40px 20px 20px; }
    .welcome-icon {
      width:60px; height:60px; border-radius:50%;
      background:var(--accent-soft); border:1px solid var(--border-glow);
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 14px; font-size:26px;
    }
    .welcome h2 { font-size:19px; font-weight:600; margin-bottom:8px; }
    .welcome p { font-size:13.5px; color:var(--text-muted); line-height:1.7; }

    /* ── FILE PREVIEW STRIP ── */
    .file-preview-strip {
      display:none; flex-wrap:wrap; gap:8px;
      padding:8px 12px 0;
    }
    .file-preview-strip.has-files { display:flex; }

    .preview-chip {
      display:flex; align-items:center; gap:6px;
      background:rgba(59,130,246,.12); border:1px solid var(--border-glow);
      border-radius:10px; padding:5px 10px; font-size:12px;
      max-width:180px; position:relative;
    }
    .preview-chip img { width:32px; height:32px; object-fit:cover; border-radius:6px; flex-shrink:0; }
    .preview-chip .chip-icon { font-size:18px; flex-shrink:0; }
    .preview-chip .chip-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
    .preview-chip .chip-remove {
      background:none; border:none; color:var(--text-muted);
      cursor:pointer; font-size:14px; padding:0 2px; flex-shrink:0;
      transition:color .15s;
    }
    .preview-chip .chip-remove:hover { color:#f87171; }

    /* ── INPUT AREA ── */
    .input-area {
      position:fixed; bottom:0; left:0; right:0;
      padding:8px 16px 16px;
      background:linear-gradient(to top,var(--bg-deep) 70%,transparent);
      display:flex; justify-content:center;
    }
    body.sidebar-open .input-area { right:var(--sidebar-w); }

    .input-inner { width:100%; max-width:860px; }

    .input-box {
      display:flex; flex-direction:column;
      background:var(--bg-input); border:1px solid var(--border);
      border-radius:var(--radius-lg); overflow:hidden;
      transition:border-color .2s;
    }
    .input-box:focus-within { border-color:var(--border-glow); box-shadow:0 0 0 3px var(--accent-soft); }

    .input-row { display:flex; align-items:flex-end; gap:8px; padding:9px 11px; }

    textarea {
      flex:1; resize:none; border:none; outline:none;
      background:transparent; color:var(--text-primary);
      font-family:inherit; font-size:15px;
      min-height:42px; max-height:120px; line-height:1.6;
    }
    textarea::placeholder { color:var(--text-muted); }

    .attach-btn {
      width:38px; height:38px; flex-shrink:0; border:none; border-radius:50%;
      background:rgba(99,179,255,.1); color:var(--text-muted);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background .2s,color .2s;
    }
    .attach-btn:hover { background:rgba(99,179,255,.2); color:var(--text-primary); }

    .send-btn {
      width:40px; height:40px; flex-shrink:0; border:none; border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--purple));
      color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:transform .15s,box-shadow .15s;
      box-shadow:0 4px 14px var(--accent-glow);
    }
    .send-btn:hover:not(:disabled) { transform:scale(1.08); }
    .send-btn:disabled { opacity:.4; cursor:not-allowed; }

    .input-hint { text-align:center; font-size:11px; color:var(--text-muted); margin-top:6px; opacity:.6; }

    /* drag-over highlight */
    .input-box.dragover { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

    /* overlay */
    .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9; }
    .sidebar-overlay.show { display:block; }

    @media(max-width:640px){
      .sidebar { position:fixed; right:0; top:0; height:100dvh; }
      body.sidebar-open .input-area { right:0; }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar hidden" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">السجل</span>
    <button class="new-chat-btn" onclick="newSession()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      محادثة جديدة
    </button>
  </div>
  <div class="sessions-list" id="sessionsList"></div>
  <div class="sidebar-footer">
    <button class="clear-all-btn" onclick="clearAllSessions()">🗑 مسح كل السجل</button>
  </div>
</div>

<div class="main">
  <div class="header">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="#63b3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">المساعد الذكي</div>
      <div class="header-status"><span class="dot-online"></span>متصل وجاهز</div>
    </div>

    <!-- New chat button in header -->
    <button class="header-btn" onclick="newSession()" title="محادثة جديدة">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      جديد
    </button>

    <!-- History toggle -->
    <button class="header-btn" id="historyToggle" onclick="toggleSidebar()" title="السجل">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/>
      </svg>
      السجل
    </button>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input-area">
    <div class="input-inner">
      <div class="input-box" id="inputBox">
        <!-- file preview chips -->
        <div class="file-preview-strip" id="fileStrip"></div>
        <div class="input-row">
          <!-- hidden file input -->
          <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.ppt,.pptx" style="display:none" onchange="onFilesSelected(event)"/>
          <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="إرفاق ملف">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66L9.41 17a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <textarea id="messageInput" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="إرسال">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="input-hint">Enter للإرسال • Shift+Enter لسطر جديد • اسحب ملف هنا</div>
    </div>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://n8n.srv1764172.hstgr.cloud/webhook/ai-agent";
  const STORAGE_KEY = "ai_chat_sessions";

  const chatEl   = document.getElementById("chat");
  const inputEl  = document.getElementById("messageInput");
  const sendBtn  = document.getElementById("sendBtn");
  const sidebar  = document.getElementById("sidebar");
  const overlay  = document.getElementById("overlay");
  const histBtn  = document.getElementById("historyToggle");
  const sessList = document.getElementById("sessionsList");
  const fileStrip= document.getElementById("fileStrip");
  const inputBox = document.getElementById("inputBox");

  let sessions   = [];
  let activeId   = null;
  let sidebarOpen= false;
  let pendingFiles= []; // [{name, size, type, base64, previewUrl}]

  // ── Storage ──
  function loadSessions() {
    try { sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { sessions = []; }
  }
  function saveSessions() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  }
  function getSession(id) { return sessions.find(s => s.id === id); }

  // ── Sessions ──
  function newSession() {
    const id = Date.now().toString();
    sessions.unshift({ id, title:"محادثة جديدة", date:new Date().toISOString(), messages:[] });
    saveSessions();
    loadSession(id);
    renderSessionsList();
    // close sidebar on mobile after new session
    if (window.innerWidth < 640 && sidebarOpen) toggleSidebar();
  }

  function loadSession(id) {
    activeId = id;
    const s = getSession(id);
    chatEl.innerHTML = "";
    clearPendingFiles();
    if (!s || s.messages.length === 0) {
      renderWelcome();
    } else {
      s.messages.forEach(m => {
        if (m.type === "image") renderImageBubble(m.previewUrl, m.name, false);
        else if (m.type === "file") renderFileBubble(m.name, m.size, false);
        else renderMessage(m.text, m.role, false);
      });
    }
    renderSessionsList();
  }

  function saveMsg(msg) {
    const s = getSession(activeId);
    if (!s) return;
    s.messages.push(msg);
    if (s.title === "محادثة جديدة") {
      const first = s.messages.find(m => m.role === "user" && m.text);
      if (first) s.title = first.text.slice(0, 40);
      else {
        const firstFile = s.messages.find(m => m.name);
        if (firstFile) s.title = "📎 " + firstFile.name.slice(0, 35);
      }
    }
    s.date = new Date().toISOString();
    sessions = [s, ...sessions.filter(x => x.id !== activeId)];
    saveSessions();
    renderSessionsList();
  }

  function deleteSession(id, e) {
    e.stopPropagation();
    sessions = sessions.filter(s => s.id !== id);
    saveSessions();
    if (activeId === id) {
      if (sessions.length > 0) loadSession(sessions[0].id);
      else newSession();
    } else { renderSessionsList(); }
  }

  function clearAllSessions() {
    if (!confirm("مسح كل المحادثات؟")) return;
    sessions = []; saveSessions(); newSession();
  }

  // ── Sidebar ──
  function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    sidebar.classList.toggle("hidden", !sidebarOpen);
    overlay.classList.toggle("show", sidebarOpen);
    document.body.classList.toggle("sidebar-open", sidebarOpen);
    histBtn.classList.toggle("active", sidebarOpen);
  }

  function formatDate(iso) {
    const d = new Date(iso), now = new Date(), diff = now - d;
    if (diff < 60000)    return "الآن";
    if (diff < 3600000)  return Math.floor(diff/60000) + " د";
    if (diff < 86400000) return Math.floor(diff/3600000) + " س";
    return d.toLocaleDateString("ar-JO",{month:"short",day:"numeric"});
  }

  function renderSessionsList() {
    sessList.innerHTML = "";
    if (sessions.length === 0) {
      sessList.innerHTML = '<div class="no-sessions">لا توجد محادثات<br/>ابدأ محادثة جديدة ✦</div>';
      return;
    }
    sessions.forEach(s => {
      const item = document.createElement("div");
      item.className = "session-item" + (s.id === activeId ? " active" : "");
      item.innerHTML = `
        <div class="session-icon">💬</div>
        <div class="session-info">
          <div class="session-preview">${escHtml(s.title)}</div>
          <div class="session-date">${formatDate(s.date)}</div>
        </div>
        <button class="session-delete" title="حذف">✕</button>`;
      item.addEventListener("click", () => loadSession(s.id));
      item.querySelector(".session-delete").addEventListener("click", e => deleteSession(s.id, e));
      sessList.appendChild(item);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── Render helpers ──
  function removeWelcome() {
    const w = chatEl.querySelector(".welcome");
    if (w) w.remove();
  }

  function renderWelcome() {
    const w = document.createElement("div");
    w.className = "welcome";
    w.innerHTML = `<div class="welcome-icon">✦</div><h2>مرحباً بك</h2>
      <p>اسألني أي شيء وسأحاول مساعدتك<br/>عبر وكيل الذكاء الاصطناعي</p>`;
    chatEl.appendChild(w);
  }

  function renderMessage(text, role, animate=true) {
    removeWelcome();
    const wrap = document.createElement("div");
    wrap.className = "message " + role;
    if (!animate) wrap.style.animation = "none";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "أ" : "✦";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function renderImageBubble(src, name, animate=true) {
    removeWelcome();
    const wrap = document.createElement("div");
    wrap.className = "img-bubble user-img";
    if (!animate) wrap.style.animation = "none";
    const img = document.createElement("img");
    img.src = src; img.alt = name;
    wrap.appendChild(img);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function renderFileBubble(name, size, animate=true) {
    removeWelcome();
    const ext = name.split('.').pop().toUpperCase();
    const icons = {PDF:"📄",DOC:"📝",DOCX:"📝",XLS:"📊",XLSX:"📊",PPT:"📋",PPTX:"📋",TXT:"📃",CSV:"📊"};
    const icon = icons[ext] || "📎";
    const wrap = document.createElement("div");
    wrap.className = "file-bubble user-file";
    if (!animate) wrap.style.animation = "none";
    wrap.innerHTML = `<div class="file-icon">${icon}</div>
      <div class="file-info">
        <div class="file-name">${escHtml(name)}</div>
        <div class="file-size">${formatSize(size)} • ${ext}</div>
      </div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function renderTyping() {
    removeWelcome();
    const wrap = document.createElement("div");
    wrap.className = "message bot";
    const avatar = document.createElement("div");
    avatar.className = "avatar"; avatar.textContent = "✦";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `<div class="typing-indicator"><div class="dots"><span></span><span></span><span></span></div>جاري التفكير...</div>`;
    wrap.appendChild(avatar); wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + " KB";
    return (bytes/1048576).toFixed(1) + " MB";
  }

  // ── File handling ──
  function onFilesSelected(e) {
    Array.from(e.target.files).forEach(addFile);
    e.target.value = ""; // reset so same file can be re-selected
  }

  function addFile(file) {
    const isImage = file.type.startsWith("image/");
    const reader = new FileReader();
    reader.onload = (ev) => {
      const base64 = ev.target.result.split(",")[1];
      const previewUrl = isImage ? ev.target.result : null;
      const id = Date.now() + Math.random();
      pendingFiles.push({ id, name:file.name, size:file.size, type:file.type, base64, previewUrl, isImage });
      renderFileChip({ id, name:file.name, size:file.size, isImage, previewUrl });
    };
    reader.readAsDataURL(file);
  }

  function renderFileChip(f) {
    const chip = document.createElement("div");
    chip.className = "preview-chip";
    chip.dataset.id = f.id;
    const ext = f.name.split('.').pop().toUpperCase();
    const icons = {PDF:"📄",DOC:"📝",DOCX:"📝",XLS:"📊",XLSX:"📊",PPT:"📋",PPTX:"📋",TXT:"📃",CSV:"📊"};
    chip.innerHTML = f.isImage
      ? `<img src="${f.previewUrl}" alt="${escHtml(f.name)}"/>`
      : `<span class="chip-icon">${icons[ext]||"📎"}</span>`;
    chip.innerHTML += `<span class="chip-name">${escHtml(f.name)}</span>
      <button class="chip-remove" onclick="removeChip('${f.id}')" title="إزالة">✕</button>`;
    fileStrip.appendChild(chip);
    fileStrip.classList.add("has-files");
  }

  function removeChip(id) {
    pendingFiles = pendingFiles.filter(f => String(f.id) !== String(id));
    const chip = fileStrip.querySelector(`[data-id="${id}"]`);
    if (chip) chip.remove();
    if (fileStrip.children.length === 0) fileStrip.classList.remove("has-files");
  }

  function clearPendingFiles() {
    pendingFiles = [];
    fileStrip.innerHTML = "";
    fileStrip.classList.remove("has-files");
  }

  // ── Drag & drop ──
  inputBox.addEventListener("dragover", e => { e.preventDefault(); inputBox.classList.add("dragover"); });
  inputBox.addEventListener("dragleave", () => inputBox.classList.remove("dragover"));
  inputBox.addEventListener("drop", e => {
    e.preventDefault();
    inputBox.classList.remove("dragover");
    Array.from(e.dataTransfer.files).forEach(addFile);
  });

  // ── Send ──
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text && pendingFiles.length === 0) return;
    if (!activeId) return;

    // render files in chat
    pendingFiles.forEach(f => {
      if (f.isImage) {
        renderImageBubble(f.previewUrl, f.name);
        saveMsg({ role:"user", type:"image", name:f.name, size:f.size, previewUrl:f.previewUrl });
      } else {
        renderFileBubble(f.name, f.size);
        saveMsg({ role:"user", type:"file", name:f.name, size:f.size });
      }
    });

    // render text
    if (text) {
      renderMessage(text, "user");
      saveMsg({ role:"user", type:"text", text });
    }

    // build payload
    const payload = { message: text || "" };
    if (pendingFiles.length > 0) {
      payload.files = pendingFiles.map(f => ({
        name: f.name, type: f.type, size: f.size, base64: f.base64
      }));
    }

    clearPendingFiles();
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    const typingBubble = renderTyping();

    try {
      const res = await fetch(WEBHOOK_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      const reply = data.reply || data.output || data.text || JSON.stringify(data, null, 2);
      typingBubble.innerHTML = "";
      typingBubble.textContent = reply;
      saveMsg({ role:"bot", type:"text", text:reply });
    } catch (err) {
      typingBubble.innerHTML = "";
      typingBubble.textContent = "تعذّر الاتصال بالوكيل. تأكد أن n8n يعمل وأن رابط الـ webhook صحيح.";
      console.error(err);
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Init ──
  loadSessions();
  if (sessions.length === 0) newSession();
  else { loadSession(sessions[0].id); renderSessionsList(); }
</script>
</body>
</html>
